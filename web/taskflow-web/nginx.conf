server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en las respuestas.
    server_tokens off;

    # Cabeceras de seguridad. La CSP solo permite cargar código propio; las imágenes externas admitidas son
    # los avatares de GitHub. 'unsafe-inline' en estilos es por los style="" que usa la interfaz (colores de
    # etiquetas, posiciones del drag & drop); los scripts en línea siguen prohibidos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API vive en el mismo origen que el frontend: sin CORS, y la cookie de sesión viaja sola.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # La API limita intentos de login por IP: tiene que ver la del cliente, no la de nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real (SignalR). Un WebSocket del navegador no puede mandar headers, así que el token viaja en la
    # query: por eso este bloque NO escribe access log (quedaría el token guardado en un archivo).
    location /hubs/ {
        access_log off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h; # la conexión queda abierta; sin esto nginx la corta a los 60 s de silencio
    }

    # Archivos con hash en el nombre (los genera Vite): se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier otra ruta devuelve index.html, que nunca se cachea
    # (si no, tras un despliegue el navegador seguiría pidiendo los assets viejos).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
